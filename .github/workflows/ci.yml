name: CI
on:
  push:
    branches: [ main ]
  pull_request_target:
    branches: [ main ]

jobs:
  Quality:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@v2
      with:
        python-version: '3.10'
    - name: Install Python Poetry
      uses: abatilo/actions-poetry@v2.1.0
      with:
        poetry-version: 1.8.5
    - name: Configure poetry
      shell: bash
      run: python -m poetry config virtualenvs.in-project true
    - name: Install dependencies
      run: |
        python -m poetry install

  Release:
    needs: Quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'Automatically generated by python-semantic-release')
    runs-on: ubuntu-latest
    concurrency:
      group: placeholder-release
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          token: ${{ secrets.GH_TOKEN }}
      - name: Pin release to triggering commit
        run: git reset --hard "$GITHUB_SHA"
      - name: Semantic Release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          git_committer_name: github-actions
          git_committer_email: github-actions@github.com

  ReleasePreview:
    needs: Quality
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      - name: Checkout base branch
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Semantic Release preview
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ github.token }}
          git_committer_name: github-actions
          git_committer_email: github-actions@github.com
          no_operation_mode: true
